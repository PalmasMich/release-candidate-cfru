{
  "scenes": [
    {
      "id": "RC_DIALOGUE_OPENING",
      "speaker": "Delivery Lead",
      "lines": [
        "Benvenuto su Release Candidate.",
        "Il progetto è già partito. Le scadenze pure. Ottimo tempismo.",
        "Io coordino la delivery. Ti dico cosa sappiamo. Il resto lo scopriremo insieme agli stakeholder."
      ]
    },
    {
      "id": "RC_DIALOGUE_PLAYER_NAME",
      "speaker": "Delivery Lead",
      "lines": [
        "Prima di aprirti gli accessi, devo creare il tuo badge.",
        "Come vuoi comparire nel workspace?",
        "Perfetto. Badge creato.",
        "Accessi quasi pronti. Il quasi è una dipendenza esterna."
      ]
    },
    {
      "id": "RC_DIALOGUE_RIVAL_INTRO",
      "speaker": "KPI Rival",
      "lines": [
        "Io tengo traccia di tutto quello che può diventare un grafico.",
        "Non è una gara.",
        "La classifica serve solo per dare contesto ai numeri."
      ]
    },
    {
      "id": "RC_DIALOGUE_RIVAL_NAME",
      "speaker": "Delivery Lead",
      "lines": [
        "Lui è KPI Rival.",
        "È bravo, veloce e considera ogni conversazione una potenziale dashboard.",
        "Dice che non compete con nessuno. Ha già aperto il confronto."
      ]
    },
    {
      "id": "RC_DIALOGUE_DELIVERY_HUB_WELCOME",
      "speaker": "Delivery Lead",
      "lines": [
        "Questo è il Delivery Hub.",
        "Da qui partono task, escalation e promesse fatte prima di consultarci.",
        "Il tuo onboarding, per ragioni che nessuno saprà spiegarti, prevede una scelta importante."
      ]
    },
    {
      "id": "RC_DIALOGUE_STARTER",
      "speaker": "Delivery Lead",
      "lines": [
        "Tre partner sono disponibili per l'assegnazione.",
        "Tartrek, Frobyte ed Emberfox.",
        "Scegline uno. Gli altri due verranno riallocati con una mail che li definirà entusiasti."
      ]
    },
    {
      "id": "RC_DIALOGUE_STARTER_TARTREK_INFO",
      "speaker": "Delivery Lead",
      "lines": [
        "Tartrek. Erba e Terra.",
        "Solido, paziente e difficile da spostare quando ha preso una decisione."
      ]
    },
    {
      "id": "RC_DIALOGUE_STARTER_FROBYTE_INFO",
      "speaker": "Delivery Lead",
      "lines": [
        "Frobyte. Acqua ed Elettro.",
        "Rapido, reattivo e sempre a un passo dal sovraccarico."
      ]
    },
    {
      "id": "RC_DIALOGUE_STARTER_EMBERFOX_INFO",
      "speaker": "Delivery Lead",
      "lines": [
        "Emberfox. Fuoco e Buio.",
        "Astuto, sicuro e allergico ai processi troppo lunghi."
      ]
    },
    {
      "id": "RC_DIALOGUE_STARTER_TARTREK_CONFIRM",
      "speaker": "System",
      "lines": [
        "Tartrek entra nel team.",
        "Assegnazione completata."
      ]
    },
    {
      "id": "RC_DIALOGUE_STARTER_FROBYTE_CONFIRM",
      "speaker": "System",
      "lines": [
        "Frobyte entra nel team.",
        "Assegnazione completata."
      ]
    },
    {
      "id": "RC_DIALOGUE_STARTER_EMBERFOX_CONFIRM",
      "speaker": "System",
      "lines": [
        "Emberfox entra nel team.",
        "Assegnazione completata."
      ]
    },
    {
      "id": "RC_DIALOGUE_STARTER_ALREADY_ASSIGNED",
      "speaker": "System",
      "lines": [
        "Hai già un partner assegnato.",
        "Cambiare ora richiede una change request.",
        "Nessuno vuole aprirla."
      ]
    },
    {
      "id": "RC_DIALOGUE_RIVAL_BEFORE_STARTER",
      "speaker": "KPI Rival",
      "lines": [
        "Prima scegli il tuo partner.",
        "Poi facciamo un confronto puramente informativo.",
        "Ho già preparato il grafico."
      ]
    },
    {
      "id": "RC_DIALOGUE_RIVAL_CHALLENGE",
      "speaker": "KPI Rival",
      "lines": [
        "Scelta registrata.",
        "Facciamo un test rapido prima che cambi qualcosa.",
        "Non è una gara. Partiamo appena sei pronto."
      ]
    },
    {
      "id": "RC_DIALOGUE_RIVAL_WIN",
      "speaker": "KPI Rival",
      "lines": [
        "Interessante.",
        "Aggiorno la dashboard.",
        "Per correttezza statistica ignorerò il fatto che il campione è uno."
      ]
    },
    {
      "id": "RC_DIALOGUE_RIVAL_LOSE",
      "speaker": "KPI Rival",
      "lines": [
        "Buona partenza.",
        "Metto il risultato in dashboard.",
        "Le note metodologiche, per ora, non servono."
      ]
    },
    {
      "id": "RC_DIALOGUE_RIVAL_REPEAT",
      "speaker": "KPI Rival",
      "lines": [
        "Sto già aggiornando la dashboard.",
        "Non è una gara. La classifica però esiste."
      ]
    },
    {
      "id": "RC_DIALOGUE_FIRST_ASSIGNMENT",
      "speaker": "Delivery Lead",
      "lines": [
        "Primo incarico.",
        "Raggiungi Marina Porto passando dal Port Link.",
        "Consegna semplice, percorso semplice, nessuna sorpresa.",
        "Ho appena compromesso tutto dicendolo ad alta voce."
      ]
    },
    {
      "id": "RC_DIALOGUE_HUB_EXIT_LOCKED",
      "speaker": "System",
      "lines": [
        "Uscita sospesa.",
        "Completa il confronto KPI prima di lasciare il Delivery Hub."
      ]
    },
    {
      "id": "RC_DIALOGUE_HUB_NPC_ANALYST",
      "speaker": "Analista",
      "lines": [
        "Ho tre versioni dello stesso requisito.",
        "Una è del business, una del tecnico e una è quella che tutti ricordano.",
        "Al momento sono tutte approvate."
      ]
    },
    {
      "id": "RC_DIALOGUE_HUB_NPC_DEVELOPER",
      "speaker": "Sviluppatore",
      "lines": [
        "Il requisito è cambiato di nuovo.",
        "Mi hanno detto che non è rework.",
        "Quindi evidentemente il codice si riscrive da solo."
      ]
    },
    {
      "id": "RC_DIALOGUE_HUB_NPC_PM",
      "speaker": "Project Manager",
      "lines": [
        "La timeline è sotto controllo.",
        "Le date sono tutte lì.",
        "È il loro rapporto con la realtà che stiamo ancora validando."
      ]
    },
    {
      "id": "RC_DIALOGUE_HUB_SIGN",
      "speaker": "System",
      "lines": [
        "DELIVERY HUB",
        "Persone, task e priorità entrano qui.",
        "L'ordine di uscita non è garantito."
      ]
    },
    {
      "id": "RC_DIALOGUE_MARINA_ARRIVAL",
      "speaker": "System",
      "lines": [
        "MARINA PORTO",
        "Mare, sole e backlog aperti."
      ]
    },
    {
      "id": "RC_DIALOGUE_MARINA_NPC_LOCAL",
      "speaker": "Abitante",
      "lines": [
        "Qui al porto capisci subito quando cambia il vento.",
        "Nel tuo progetto pare succeda più spesso."
      ]
    },
    {
      "id": "RC_DIALOGUE_MARINA_NPC_CONSULTANT",
      "speaker": "Consulente",
      "lines": [
        "Sono venuto per una call di mezz'ora.",
        "Sono qui da tre sprint."
      ]
    },
    {
      "id": "RC_DIALOGUE_MARINA_NPC_TESTER",
      "speaker": "Tester",
      "lines": [
        "Ho trovato un bug.",
        "Succede sempre, tranne quando provo a mostrarlo.",
        "Mi hanno chiesto se possiamo chiamarlo comportamento intermittente."
      ]
    },
    {
      "id": "RC_DIALOGUE_MARINA_SIGN",
      "speaker": "System",
      "lines": [
        "MARINA PORTO",
        "Prossimo checkpoint: Port Link."
      ]
    },
    {
      "id": "RC_DIALOGUE_WILD_TUTORIAL_TRIGGER",
      "speaker": "System",
      "lines": [
        "Attività sul campo.",
        "Nel Port Link puoi incontrare creature selvatiche.",
        "È il momento di capire come lavora davvero il tuo partner."
      ]
    },
    {
      "id": "RC_DIALOGUE_PORT_LINK_HINT",
      "speaker": "Delivery Lead",
      "lines": [
        "Attraversa il Port Link e chiudi la verifica.",
        "Poi raggiungi Marina Porto.",
        "Per ora lo scope è ancora quello."
      ]
    },
    {
      "id": "RC_DIALOGUE_PORT_LINK_ACCESS_LOCKED",
      "speaker": "System",
      "lines": [
        "Port Link non assegnato.",
        "Completa l'onboarding nel Delivery Hub."
      ]
    },
    {
      "id": "RC_DIALOGUE_PORT_TRAINER_INTRO",
      "speaker": "Consulente Junior",
      "lines": [
        "Scusa, sei tu la nuova risorsa?",
        "Mi hanno chiesto una verifica veloce prima di lasciarti passare.",
        "Dicono cinque minuti. Io ne ho messi trenta in calendario."
      ]
    },
    {
      "id": "RC_DIALOGUE_PORT_TRAINER_DEFEAT",
      "speaker": "Consulente Junior",
      "lines": [
        "Ok. Verifica chiusa.",
        "Direi esito positivo.",
        "Aspetta che lo scrivo prima che qualcuno chieda un retest."
      ]
    },
    {
      "id": "RC_DIALOGUE_PORT_TRAINER_OUTRO",
      "speaker": "Consulente Junior",
      "lines": [
        "Passa pure.",
        "Se chiedono, non c'è mai stato nessun blocker."
      ]
    },
    {
      "id": "RC_DIALOGUE_DEPLOY_TEASER",
      "speaker": "Delivery Lead",
      "lines": [
        "Aggiornamento.",
        "Il deploy è bloccato.",
        "Dicono che manchi una cosa piccola.",
        "Non hanno specificato quanto piccola."
      ]
    },
    {
      "id": "RC_DIALOGUE_SCOPE_CHANGE",
      "speaker": "Delivery Lead",
      "lines": [
        "Cambio requisiti.",
        "La consegna non può più passare dal flusso concordato.",
        "Serve una validazione al Castello.",
        "Il requisito è nuovo. La scadenza, curiosamente, è già vecchia."
      ]
    },
    {
      "id": "RC_DIALOGUE_SCOPE_CHANGE_REPEAT",
      "speaker": "Delivery Lead",
      "lines": [
        "Nuovo scope confermato.",
        "Vai verso il Castello.",
        "Io provo a capire chi ha approvato una cosa che nessuno ricorda di aver chiesto."
      ]
    },
    {
      "id": "RC_DIALOGUE_CASTELLO_LOCKED",
      "speaker": "System",
      "lines": [
        "CASTELLO",
        "Accesso non previsto dallo scope corrente.",
        "Serve una change request."
      ]
    },
    {
      "id": "RC_DIALOGUE_CASTELLO_UNLOCK",
      "speaker": "System",
      "lines": [
        "Change request approvata.",
        "Accesso al Castello autorizzato."
      ]
    },
    {
      "id": "RC_DIALOGUE_CASTELLO_NPC_STAKEHOLDER",
      "speaker": "Stakeholder",
      "lines": [
        "Non ho cambiato requisito.",
        "Ho chiarito quello che intendevo.",
        "Il fatto che l'abbia chiarito dopo la consegna è solo una questione temporale."
      ]
    },
    {
      "id": "RC_DIALOGUE_CASTELLO_NPC_ARCHITECT",
      "speaker": "Architetto",
      "lines": [
        "La soluzione è semplice.",
        "Ridisegniamo metà del flusso.",
        "La parte importante è non chiamarlo ridisegno."
      ]
    },
    {
      "id": "RC_DIALOGUE_CASTELLO_NPC_SENIOR",
      "speaker": "Senior Consultant",
      "lines": [
        "Ricorda una regola.",
        "Quando tutti dicono che manca solo una piccola modifica, controlla il calendario."
      ]
    },
    {
      "id": "RC_DIALOGUE_RIVAL_CASTELLO",
      "speaker": "KPI Rival",
      "lines": [
        "Ho già recepito il nuovo requisito.",
        "La velocity resta alta se separi il lavoro nuovo dal lavoro che rifai.",
        "È una scelta di rappresentazione."
      ]
    },
    {
      "id": "RC_DIALOGUE_DEPLOY_DISTRICT_ARRIVAL",
      "speaker": "System",
      "lines": [
        "DEPLOY DISTRICT",
        "Da qui in poi ogni errore ha un pubblico."
      ]
    },
    {
      "id": "RC_DIALOGUE_DEPLOY_NPC_OPS",
      "speaker": "Ops",
      "lines": [
        "In DEV funziona.",
        "In UAT funziona se non guardi troppo da vicino.",
        "In produzione avremo finalmente dati reali."
      ]
    },
    {
      "id": "RC_DIALOGUE_DEPLOY_NPC_BUSINESS",
      "speaker": "Business",
      "lines": [
        "Per me possiamo andare.",
        "A patto che non cambi nulla.",
        "Ti aggiorno tra cinque minuti su cosa intendo per nulla."
      ]
    },
    {
      "id": "RC_DIALOGUE_DEPLOY_NPC_RELEASE",
      "speaker": "Release Coordinator",
      "lines": [
        "Mi servono tre approvazioni.",
        "Due persone sono offline.",
        "La terza è online solo per spiegare che non è owner."
      ]
    },
    {
      "id": "RC_DIALOGUE_GO_NO_GO_START",
      "speaker": "System",
      "lines": [
        "GO/NO-GO AVVIATO.",
        "Tutti hanno un'opinione.",
        "La decisione, invece, non ha ancora un owner."
      ]
    },
    {
      "id": "RC_DIALOGUE_RELEASE_MANAGER_INTRO",
      "speaker": "Release Manager",
      "lines": [
        "Quindi sei tu quello che vuole andare in produzione.",
        "Pacchetto pronto, test verdi, scope validato.",
        "Bene.",
        "Adesso vediamo se regge quando smettiamo di chiamarlo ambiente di test."
      ]
    },
    {
      "id": "RC_DIALOGUE_RELEASE_MANAGER_DEFEAT",
      "speaker": "Release Manager",
      "lines": [
        "Bene.",
        "Questa passa.",
        "Segno GO.",
        "Goditi il verde finché dura."
      ]
    },
    {
      "id": "RC_DIALOGUE_DEPLOY_ROOM_LOCKED",
      "speaker": "System",
      "lines": [
        "DEPLOY ROOM 01",
        "Go/No-Go non ancora autorizzato.",
        "Torna quando tutti avranno deciso di decidere."
      ]
    },
    {
      "id": "RC_DIALOGUE_DEPLOY_COMPLETE",
      "speaker": "System",
      "lines": [
        "DEPLOY 01 COMPLETATO.",
        "Release Candidate è in produzione.",
        "Nessun ticket aperto.",
        "Sono passati undici secondi."
      ]
    },
    {
      "id": "RC_DIALOGUE_POST_DEPLOY_LEAD",
      "speaker": "Delivery Lead",
      "lines": [
        "Primo deploy completato.",
        "Ora sei ufficialmente onboardato.",
        "Domani iniziamo con una cosa più semplice.",
        "È quello che mi hanno detto."
      ]
    },
    {
      "id": "RC_DIALOGUE_POST_DEPLOY_RIVAL",
      "speaker": "KPI Rival",
      "lines": [
        "Bel deploy.",
        "La dashboard dice che siamo quasi pari.",
        "Ho controllato due volte.",
        "Quasi."
      ]
    },
    {
      "id": "RC_DIALOGUE_NEXT_CHAPTER_TEASER",
      "speaker": "System",
      "lines": [
        "Nuovo progetto assegnato.",
        "Destinazione: Milano.",
        "Scope: da definire.",
        "Scadenza: già definita."
      ]
    },
    {
      "id": "RC_DIALOGUE_MARINA_BUG_REPORT_START",
      "speaker": "Tester",
      "lines": [
        "Ho un bug che compare solo qui a Marina.",
        "Se trovi il terminale vicino al molo, prova a replicarlo.",
        "Sì, la descrizione è davvero questa precisa."
      ]
    },
    {
      "id": "RC_DIALOGUE_MARINA_BUG_REPORT_DONE",
      "speaker": "System",
      "lines": [
        "Bug riprodotto.",
        "Passi per riprodurlo: ancora poco chiari.",
        "Il Tester però sembra stranamente felice."
      ]
    },
    {
      "id": "RC_DIALOGUE_MARINA_BUG_REPORT_REPEAT",
      "speaker": "Tester",
      "lines": [
        "Perfetto. Ora che lo hai riprodotto possiamo chiamarlo noto.",
        "Fix previsto: da pianificare."
      ]
    },
    {
      "id": "RC_DIALOGUE_RAMEN_STOP_FIRST",
      "speaker": "Oste — Locanda del Molo",
      "lines": [
        "Benvenuto alla Locanda del Molo.",
        "Qui serviamo ramen caldo e teniamo le call fuori dalla porta.",
        "Siediti un momento. Il progetto può sopravvivere dieci minuti senza di te."
      ]
    },
    {
      "id": "RC_DIALOGUE_RAMEN_STOP_REPEAT",
      "speaker": "Oste — Locanda del Molo",
      "lines": [
        "Bentornato alla Locanda del Molo.",
        "Il ramen è pronto. Il backlog può aspettare."
      ]
    },
    {
      "id": "RC_DIALOGUE_CASTELLO_VIEWPOINT_FIRST",
      "speaker": "System",
      "lines": [
        "Dal Castello vedi Marina, il porto e quasi tutto il percorso fatto.",
        "Per un attimo anche lo scope sembra chiaro."
      ]
    },
    {
      "id": "RC_DIALOGUE_CASTELLO_VIEWPOINT_REPEAT",
      "speaker": "System",
      "lines": [
        "Il panorama non è cambiato.",
        "Lo scope probabilmente sì."
      ]
    }
  ]
}
